; AIRSQAD Cam Linker — GoPro <-> Betaflight OSD bridge
; Board: ESP32-C3 SuperMini
;
; Если у вашей конкретной платы другое имя в PlatformIO board registry,
; можно заменить board на "esp32-c3-devkitm-1" (обычно подходит для SuperMini
; с автодетектом USB-CDC).

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; USB-CDC на C3 используется и для прошивки, и для Serial-логов
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1

; Исключаем диагностические инструменты (у них свои setup()/loop()) —
; иначе линковка основной прошивки падает на дублирующихся символах.
build_src_filter = +<*> -<ble_scan_main.cpp> -<wifi_scan_main.cpp>

; Временный диагностический BLE-сканер (не часть основной прошивки).
; Печатает в Serial все найденные BLE-устройства: имя, адрес, RSSI,
; рекламируемые сервисы. Используется, чтобы точно узнать, что именно
; рекламирует конкретная камера (Insta360/DJI), не полагаясь на чужой
; реверс-инжиниринг вслепую.
;   pio run -e ble-scan -t upload --upload-port COMx
;   pio device monitor --port COMx --baud 115200
[env:ble-scan]
extends = env:esp32-c3-supermini
build_src_filter = -<*> +<ble_scan_main.cpp>

; Диагностика Wi-Fi эфира (SSID/шифрование точек доступа поблизости).
;   pio run -e wifi-scan -t upload --upload-port COMx
[env:wifi-scan]
extends = env:esp32-c3-supermini
build_src_filter = -<*> +<wifi_scan_main.cpp>
