; GoPro <-> Betaflight OSD bridge
; Board: ESP32-C3 SuperMini
;
; Если у вашей конкретной платы другое имя в PlatformIO board registry,
; можно заменить board на "esp32-c3-devkitm-1" (обычно подходит для SuperMini
; с автодетектом USB-CDC).

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; USB-CDC на C3 используется и для прошивки, и для Serial-логов
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
